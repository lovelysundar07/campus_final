{% extends 'base.html' %}

{% block title %}Login - MS College Events{% endblock %}

{% block content %}
<div class="auth-page" style="padding-top:0;">
  <div class="auth-container">

    <!-- ── Left: Branding ── -->
    <div class="auth-branding">
      <div class="auth-branding-logo animate-scaleIn"><img class="auth-college-logo" src="{{ url_for('static', filename='images/ms-college-logo.png') }}" alt="MS College crest"></div>
      <h2 class="animate-fadeInUp animate-stagger-1">MS College</h2>
      <p class="animate-fadeInUp animate-stagger-2">Virudhunagar, 626001</p>


    </div>

    <!-- ── Right: Form ── -->
    <div class="auth-form-panel">
      <h1 class="auth-form-title animate-fadeInRight" data-i18n="auth.login">Login</h1>
      <p class="auth-form-subtitle animate-fadeInRight animate-stagger-1">
        Welcome back! Sign in to your account.
      </p>

      <form method="POST" action="{{ url_for('auth.login') }}" data-loading class="animate-fadeInUp animate-stagger-2">

        <div class="form-group">
          <label class="form-label" for="email" data-i18n="form.email">Email Address</label>
          <div style="position:relative;">
            <i class="fa-solid fa-envelope"
               style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.85rem;pointer-events:none;"></i>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              style="padding-left:36px;"
              placeholder="you@example.com"
              value="{{ request.form.get('email', '') }}"
              required
              autofocus
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <span data-i18n="form.password">Password</span>
          </label>
          <div style="position:relative;">
            <i class="fa-solid fa-lock"
               style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.85rem;pointer-events:none;"></i>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              style="padding-left:36px;padding-right:44px;"
              placeholder="Enter your password"
              required
            />
            <button type="button"
                    class="toggle-password"
                    data-target="password"
                    style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.9rem;">
              <i class="fa-solid fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <div class="form-check" style="margin-bottom:20px;">
          <input type="checkbox" id="remember" name="remember" value="1" />
          <label class="form-check-label" for="remember" data-i18n="auth.rememberMe">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span data-i18n="auth.signIn">Sign In</span>
        </button>
      </form>

      <div class="auth-divider" style="margin-top:24px;">
        <span>OR</span>
      </div>

      <div class="auth-links">
        <p style="margin-bottom:10px;">
          <span data-i18n="auth.dontHaveAccount">Don't have an account?</span>
          <a href="{{ url_for('auth.register') }}" style="margin-left:4px;" data-i18n="auth.participantRegister">Register as Participant</a>
        </p>
        <p>
          <span>Joining as faculty?</span>
          <a href="{{ url_for('auth.staff_register') }}" style="margin-left:4px;" data-i18n="auth.staffRegister">Register as Staff</a>
        </p>
      </div>
    </div>

  </div>
</div>
{% endblock %}
