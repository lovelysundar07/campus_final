{% extends 'base.html' %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="participant-layout">
  <main class="participant-main">
    <div class="participant-topbar">
      <div><h1 class="page-title">Notifications</h1></div>
    </div>
    <div class="section-card animate-fadeInUp">
      {% if notifications %}
      <div style="display:flex;flex-direction:column;gap:10px;">
        {% for n in notifications %}
        <div class="notification-item {% if not n.is_read %}unread{% endif %}">
          <div style="font-weight:600;">{{ n.title }}</div>
          <div class="text-muted" style="font-size:0.88rem;">{{ n.message }}</div>
          <div class="text-muted" style="font-size:0.75rem;margin-top:4px;">{{ n.created_at }}</div>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <div class="empty-state">
        <i class="fa-solid fa-bell-slash fa-3x"></i>
        <p>No notifications yet.</p>
      </div>
      {% endif %}
    </div>
  </main>
</div>
{% endblock %}
